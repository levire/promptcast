# swift-format owns layout; SwiftLint covers semantics it does not.
included: [Sources, Tests]
disabled_rules: [trailing_comma, opening_brace, line_length, identifier_name, closure_parameter_position]
opt_in_rules:
  - empty_count
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
function_body_length: { warning: 60 }
file_length: { warning: 400 }
custom_rules:
  core_imports_foundation_only:
    included: "Sources/ScreenInkCore/.*\\.swift"
    regex: "^import (?!Foundation$)\\w+"
    message: "ScreenInkCore stays free of system frameworks so it is testable without permissions. Move this code to Sources/ScreenInk."
    severity: error
  no_concurrency_escape_hatches:
    included: "Sources/.*\\.swift"
    regex: "@unchecked\\s+Sendable|nonisolated\\(unsafe\\)"
    message: "Fix the isolation instead of silencing Swift 6 concurrency checking."
    severity: error
